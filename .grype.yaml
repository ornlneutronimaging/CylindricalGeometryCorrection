# Grype ignore rules for the CI dependency gate (see
# audits/grype_vs_pip-audit_decision_memo_2026-06-10.md). Every entry needs a
# reason and, where applicable, a revisit condition — this file is the
# reviewable record of accepted risk.

ignore:
  # jupyterlab (a dev/notebook feature dependency) vendors yarn.lock manifests
  # inside its wheel: build-staging assets and test fixtures. The npm packages
  # listed there are not installed software in this environment and cannot be
  # upgraded from this repo; upstream tracks them in jupyterlab releases.
  - package:
      location: "**/site-packages/jupyterlab/staging/yarn.lock"
  - package:
      location: "**/site-packages/jupyterlab/tests/mock_packages/**"

  # CPython 3.14.5 is the newest conda-forge build today (2026-06-11); these
  # are fixed upstream but no packaged fix is installable yet. Remove these
  # entries when conda-forge ships the next CPython 3.14 patch release —
  # the lockfile-update workflow will pick it up.
  - vulnerability: CVE-2025-12781
    package:
      name: python
  - vulnerability: CVE-2025-15366
    package:
      name: python
  - vulnerability: CVE-2025-15367
    package:
      name: python
  - vulnerability: CVE-2026-3276
    package:
      name: python
  - vulnerability: CVE-2026-7210
    package:
      name: python
  - vulnerability: CVE-2026-7774
    package:
      name: python
  # Added 2026-07: the Grype vuln DB now flags these on cpython 3.14.6; the fix
  # is only in the CPython 3.15.x prerelease line, with no stable 3.14 backport
  # on conda-forge yet (newest conda-forge build is 3.14.6). Remove when a stable
  # fix lands (lockfile-update picks it up).
  - vulnerability: CVE-2026-12003
    package:
      name: python
  - vulnerability: CVE-2026-15308 # HIGH: fixed in 3.15.0, no stable 3.14 backport
    package:
      name: python

  # Added 2026-07-13: Grype flags pydantic 2.13.4 (the newest conda-forge build,
  # 2026-05-06); the fix is in pydantic 2.14.2, which is not yet packaged on
  # conda-forge (verified: conda-forge/noarch tops out at 2.13.4). Remove once
  # conda-forge ships pydantic >= 2.14.2 — the lockfile-update workflow picks it up.
  - vulnerability: CVE-2026-58203 # MEDIUM: fixed in 2.14.2, not yet on conda-forge
    package:
      name: pydantic

  # Rust crates statically linked into transitively-pulled conda packages.
  # grype catalogs them from the compiled binaries, but CGC cannot remediate
  # them here — the fix requires the upstream conda-forge package to be rebuilt
  # against a patched crate. (These are the same pyo3 advisories we fixed
  # directly in the group's own Rust repos, NEREIDS/bm3dornl, where we control
  # the build; here pyo3 is embedded in a third-party Python package.)
  #
  # rpds-py embeds pyo3 0.28.3 (chain: jupyter/docs deps -> jsonschema ->
  # referencing -> rpds-py). Remove both pyo3 entries once conda-forge ships
  # rpds-py rebuilt against pyo3 >= 0.29.0 (the first patched version) — the
  # lockfile-update workflow will pick it up.
  - vulnerability: GHSA-36hh-v3qg-5jq4 # HIGH: pyo3 OOB read in nth/nth_back for PyList/PyTuple
    package:
      name: pyo3
  - vulnerability: GHSA-chgr-c6px-7xpp # MEDIUM: pyo3 missing Sync bound on PyCFunction::new_closure
    package:
      name: pyo3
  # The comrak markdown binary (pulled by the docs toolchain) bundles `time`
  # 0.3.45. Remove once comrak is rebuilt against a patched `time`.
  - vulnerability: GHSA-r6v5-fh4h-64xc # MEDIUM: time
    package:
      name: time
