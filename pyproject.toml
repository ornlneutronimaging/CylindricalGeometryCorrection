########################
### Project Metadata ###
########################
[project]
name = "neutron-geomcorr"
description = "Neutron imaging geometric correction for cylindrical samples"
dynamic = ["version"]
# SPEC 0 (scientific-python support window); org policy decided 2026-06-10
requires-python = ">=3.12"
license = { text = "BSD" }
keywords = [
  "neutron",
  "imaging",
  "geometry",
  "correction",
  "cylindrical",
  "transmission",
]
readme = "README.md"
authors = [
  { name = "Jean Bilheux", email = "bilheuxjm@ornl.gov" },
  { name = "Chen Zhang", email = "zhangc@ornl.gov" },
]
maintainers = [
  { name = "Jean Bilheux", email = "bilheuxjm@ornl.gov" },
  { name = "Chen Zhang", email = "zhangc@ornl.gov" },
]

dependencies = [
  # Dependencies available from both PyPI and conda
  "numpy>=1.20,<3",
  # direct TIFF/FITS stack loading (replaced NeuNorm 1.x, which is
  # superseded by the scipp-based 2.0 rewrite this package does not need;
  # dropping it also drops the h5py workaround for its undeclared import)
  "tifffile",
  "astropy",
  # progress bars (widget in Jupyter, console elsewhere)
  "tqdm",
]

[project.optional-dependencies]
docs = [
  "sphinx>=8.2.1,<9",
  "sphinx_rtd_theme>=3.0.1,<4",
  "versioningit",
  "myst_parser",
  "nbsphinx>=0.8.0,<1.0",
]

[project.urls]
homepage = "https://github.com/ornlneutronimaging/CylindricalGeometryCorrection"
repository = "https://github.com/ornlneutronimaging/CylindricalGeometryCorrection"
documentation = "https://cylindricalgeometrycorrection.readthedocs.io"
issues = "https://github.com/ornlneutronimaging/CylindricalGeometryCorrection/issues"

####################
### Build config ###
####################

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "versioningit"]

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.hooks.versioningit-onbuild]
source-file = "src/neutron_geomcorr/_version.py"
build-file = "neutron_geomcorr/_version.py"

[tool.hatch.build]
artifacts = [
  "src/neutron_geomcorr/_version.py",
  "src/neutron_geomcorr/**/*.yml",
  "src/neutron_geomcorr/**/*.yaml",
  "src/neutron_geomcorr/**/*.ini",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neutron_geomcorr"]

[tool.versioningit.vcs]
method = "git"
default-tag = "0.1.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{committer_date:%Y%m%d%H%M%S}"
# Since pixi builds currently require the package version to be set statically in pyproject.toml,
# and we solve that by temporarily changing pyproject.toml during build using the pixi tasks
# sync-version and reset-toml, then we need to ignore uncommitted changes in order for the wheel
# version to be consistent with the package version
dirty = "{version}"
distance-dirty = "{next_version}.dev{committer_date:%Y%m%d%H%M%S}"

[tool.versioningit.write]
file = "src/neutron_geomcorr/_version.py"

###################
### Pixi config ###
###################

[tool.pixi.workspace]
preview = ["pixi-build"] # Required until the build feature becomes stable
channels = [
  "conda-forge",
  "https://prefix.dev/pixi-build-backends", # Required for pixi build
]
platforms = ["linux-64", "osx-arm64"] # Multi-platform support
# If you don't need to map PyPI dependencies to conda, you can remove the `conda-pypi-map` section and the `pixi-mapping.json` file.
conda-pypi-map = { "conda-forge" = "pixi-mapping.json" }

## Dependency tables - https://pixi.sh/latest/reference/pixi_manifest/#the-dependencies-tables
## These tables override the dependencies listed in the [project] section

[tool.pixi.dependencies]
# Conda package dependencies
numpy = "*"
scipy = "*"                     # Often needed for scientific computing
matplotlib = "*"                # For visualization in notebooks
plotly = ">=6.3.0,<7"
tifffile = ">=2025.6.11,<2026"
astropy = "*"                   # FITS loading in geometry_correction/file_handler
tqdm = "*"                      # progress bars (tqdm.auto)
pandas = ">=2.3.1,<3"
scikit-image = ">=0.25.2,<0.26"
pydantic = ">=2.11.7,<3"
pybaselines = ">=1.2.1,<2"
loguru = ">=0.7.3,<0.8"
pre-commit = ">=4.3.0,<5"
# CVE floors for transitive dependencies already in the tree (template-aligned);
# keeps the grype gate quiet by staying above known-fixed advisories
h2 = ">=4.3.0"               # Known vulnerability in <4.3.0
brotli = ">=1.2.0"
urllib3 = ">=2.6.3"          # Known vulnerability in <2.6.3
filelock = ">=3.20.3"        # Known vulnerability in <3.20.3
virtualenv = ">=20.36.1,<21" # Known vulnerability in <20.36.1; capped due to https://github.com/pypa/hatch/issues/2193
cryptography = ">=46.0.7"    # CVE-2026-26007, CVE-2026-39892
requests = ">=2.33.0"        # CVE-2026-25645
pillow = ">=12.2.0"          # CVE-2026-25990, CVE-2026-40192
openssl = ">=3.6.3"          # CVE-2026-34182 (critical) + 8 high fixed in 3.6.3

[tool.pixi.pypi-dependencies]
# PyPI dependencies, including this package to allow local editable installs
neutron-geomcorr = { path = ".", editable = true }

# Pixi Build configuration - https://pixi.sh/latest/reference/pixi_manifest/#pixi-build

[tool.pixi.package.host-dependencies]
hatchling = "*"
versioningit = "*"
python = ">=3.12"
setuptools = "*"   # Required for conda package building

[tool.pixi.package.run-dependencies]
python = ">=3.12"
numpy = "*"
tifffile = "*"
astropy = "*"
tqdm = "*"

[tool.pixi.package]
name = "neutron-geomcorr"
version = "0.0.0"         # placeholder, overwritten by sync-version

[tool.pixi.package.build]
# template-aligned: the 0.1.* pin predates pixi's build-API negotiation and
# fails against current pixi ("does not depend on pixi-build-api-version")
backend = { name = "pixi-build-python", version = "*" }

# Environments and Features

[tool.pixi.environments]
default = { features = [
  "docs",
  "developer",
  "package",
  "test",
  "jupyter",
], solve-group = "default" }
jupyter = { features = ["developer", "jupyter"], solve-group = "jupyter" }
# per-version test environments: the CI matrix tests real interpreter
# versions instead of relabeling the single default-env resolution
py312 = { features = ["test", "py312"], solve-group = "py312" }
py313 = { features = ["test", "py313"], solve-group = "py313" }
py314 = { features = ["test", "py314"], solve-group = "py314" }

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.test.dependencies]
pytest = ">=9.0.3"  # CVE-2025-71176 fixed in 9.0.3
pytest-cov = "*"
pytest-repeat = "*"
pytest-xdist = "*"

[tool.pixi.feature.package.dependencies]
# anaconda-client dropped: conda-publish uploads via `pixi upload` (built in)
twine = ">=6.1.0,<7"
versioningit = "*"
hatch = "*"

[tool.pixi.feature.package.pypi-dependencies]
toml-cli = "*"

[tool.pixi.feature.developer.dependencies]
pip = ">=26.0"     # CVE-2026-1703
pre-commit = "*"
ruff = "*"
versioningit = "*"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=8.2.1,<9"
sphinx_rtd_theme = ">=3.0.1,<4"
myst-parser = "*"
nbsphinx = "*"                  # For rendering notebooks in documentation

[tool.pixi.feature.jupyter.dependencies]
jupyterlab = "*"
ipympl = "*"
ipywidgets = "*"
notebook = "*"

[tool.pixi.tasks]
# Documentation
build-docs = { cmd = 'sphinx-build -b html documentation/source documentation/_build', description = "Build documentation" }
test-docs = { cmd = "sphinx-build -M doctest documentation/source documentation/_build", description = "Test building the documentation" }
# Testing
test = { description = "Run the test suite", cmd = "pytest" }
# Packaging
pypi-build = { cmd = "hatch build", description = "Build the package for PyPI" }
pypi-publish = { cmd = "twine upload dist/*", description = "Publish the package to PyPI", depends-on = [
  "pypi-build",
] }
pypi-publish-test = { cmd = "twine upload --repository testpypi dist/*", description = "Publish the package to TestPyPI", depends-on = [
  "pypi-build",
] }
conda-build-command = { cmd = "pixi build", description = "Build the conda package command" }
conda-build = { description = "Build the conda package", depends-on = [
  "backup-toml",
  "sync-version",
  "conda-build-command",
  "reset-toml",
] }
conda-publish = { cmd = "pixi upload anaconda --owner neutronimaging *.conda", description = "Publish the .conda package to the neutronimaging channel on anaconda.org", depends-on = [
  "conda-build",
] }
# Misc
# (audit-deps/pip-audit removed: grype gates dependency CVEs in CI per the
# 2026-06-10 decision memo — scans the installed env, only-fixed, SARIF)
clean = { cmd = 'rm -rf .pytest_cache .ruff_cache **/*.egg-info **/dist **/__pycache__', description = "Clean up various caches and build artifacts" }
clean-conda = { cmd = "rm -f *.conda", description = "Clean the local .conda build artifacts" }
clean-docs = { cmd = "rm -rf documentation/_build", description = "Clean up documentation build artifacts" }
clean-pypi = { cmd = "rm -rf dist", description = "Clean the PyPI build artifacts" }
clean-all = { description = "Clean all artifacts", depends-on = [
  "clean",
  "clean-conda",
  "clean-docs",
  "clean-pypi",
] }
sync-version = { cmd = 'version=$(python -m versioningit); toml set tool.pixi.package.version "$version" --toml-path pyproject.toml', description = "Sync pyproject.toml version with Git version" }
backup-toml = { cmd = "cp pyproject.toml pyproject.toml.bak", description = "Backup the pyproject.toml file" }
reset-toml = { cmd = "cp pyproject.toml.bak pyproject.toml; rm pyproject.toml.bak", description = "Reset the pyproject.toml file to the original state" }

##############
### Pytest ###
##############

[tool.pytest.ini_options]
addopts = "-v --cov=neutron_geomcorr --cov-report=term-missing"
pythonpath = [".", "src", "scripts"]
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = [
  ".git",
  "tmp*",
  "_tmp*",
  "__pycache__",
  "*dataset*",
  "*data_set*",
]

############
### Ruff ###
############

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["notebooks/**", "**/*.ipynb"]

[tool.ruff.lint]
select = ["A", "ARG", "ASYNC", "BLE", "C90", "E", "F", "I", "N", "UP032", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["neutron_geomcorr"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
