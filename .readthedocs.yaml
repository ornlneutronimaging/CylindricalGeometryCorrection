version: 2

build:
  os: "ubuntu-24.04"
  tools:
    # must stay inside requires-python (>=3.12, SPEC 0)
    python: "3.12"

sphinx:
  builder: html
  configuration: documentation/source/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
