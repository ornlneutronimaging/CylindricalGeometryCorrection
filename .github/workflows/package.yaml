name: Package and Deployment

# conda-build runs on every PR/push so the packaging pipeline stays
# continuously validated; the publish jobs only fire on release tags.
# NOTE: GitHub cannot express needs: across workflow files, so the publish
# jobs gate on this pipeline, not on the Unit Tests workflow — tags are
# expected to be cut from a green branch.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [next, main]
    tags: ["v*"]

permissions:
  contents: read

env:
  PKG_NAME: neutron-geomcorr
  MODULE_NAME: neutron_geomcorr

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conda-build:
    name: Build conda package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # for the grype SARIF upload
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          manifest-path: pyproject.toml
          environments: default

      - name: Build conda package
        run: |
          pixi run conda-build
          # pixi publish writes the package into ./local-channel/<subdir>/;
          # copy it to the workspace root for pkg-install and the artifact upload.
          find local-channel -name "*.conda" -exec cp {} . \;

      # pkg-verify requires a conda env that already has the package
      # installed (and micromamba on PATH); pkg-install sets both up.
      - name: Install built conda package
        id: install
        uses: neutrons/conda-actions/pkg-install@bba9ca89d48d9ae846db9650cc63fde736340b3d # v2
        with:
          package-name: ${{ env.PKG_NAME }}
          local-channel: ./local-channel

      - name: Verify conda package
        uses: neutrons/conda-actions/pkg-verify@bba9ca89d48d9ae846db9650cc63fde736340b3d # v2
        with:
          package-name: ${{ env.PKG_NAME }}
          module-name: ${{ env.MODULE_NAME }}
          conda-env-name: ${{ steps.install.outputs.conda_env }}

      # audit the dependencies of the conda package we just installed;
      # fail-build defaults to "false" in the wrapper — set it so this scan
      # gates like the Unit Tests workflow's dependency-scan job
      - name: Scan installed environment with Grype
        uses: neutrons/conda-actions/grype@bba9ca89d48d9ae846db9650cc63fde736340b3d # v2
        with:
          path: ${{ steps.install.outputs.conda_install_dir }}
          fail-build: false

      - name: Upload conda package as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-conda-package
          path: ${{ env.PKG_NAME }}-*.conda

  publish:
    name: Upload package to anaconda
    runs-on: ubuntu-latest
    needs: [conda-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # same-run artifact downloads use the runner's runtime token, but this
      # job only executes on release tags — explicit read is cheap insurance
      # on a path that stays unexercised until then
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # the publish wrapper runs `pixi upload`, so the pixi binary must be on
      # PATH (this is exactly what broke the v2.0.0 upload); the project env
      # itself is not needed
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          manifest-path: pyproject.toml
          run-install: false

      - name: Download conda package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-conda-package

      # README documents `conda install -c neutronimaging neutron-geomcorr`;
      # requires the ANACONDA_TOKEN secret (org-level; org decision:
      # neutronimaging channel, not neutrons)
      - name: Upload package to anaconda
        uses: neutrons/conda-actions/publish@bba9ca89d48d9ae846db9650cc63fde736340b3d # v2
        with:
          anaconda-token: ${{ secrets.ANACONDA_TOKEN }}
          organization: neutronimaging
          package-path: ${{ env.PKG_NAME }}-*.conda

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [conda-build]
    if: startsWith(github.ref, 'refs/tags/v')
    # dedicated environment for trusted publishing: list this exact name
    # ("pypi") in the PyPI trusted-publisher registration, and protection
    # rules/required reviewers can be attached to it in repo settings
    environment:
      name: pypi
      url: https://pypi.org/p/neutron-geomcorr
    permissions:
      # job-level permissions replace the workflow block, so checkout's
      # read access must be restated here
      contents: read
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          manifest-path: pyproject.toml
          environments: default

      - name: Build pypi package
        run: pixi run pypi-build

      # needs the PyPI project + trusted publisher configured first
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
