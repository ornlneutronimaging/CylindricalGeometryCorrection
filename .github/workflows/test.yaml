name: Tests, Package, and Deployment

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [next, main]
    tags: ["v*"]

permissions:
  contents: read

env:
  PKG_NAME: neutron-geomcorr
  MODULE_NAME: neutron_geomcorr

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # real per-version pixi environments (SPEC 0 window); the previous
        # python-version matrix relabeled the same default-env resolution
        environment: [py312, py313, py314]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          manifest-path: pyproject.toml
          environments: ${{ matrix.environment }}

      - name: Run unit tests
        run: pixi run -e ${{ matrix.environment }} test

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: |
          github.actor != 'dependabot[bot]' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.environment == 'py312'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # replaces the advisory-only pip-audit job: grype scans the *installed*
  # pixi env (pip + conda packages), gates only on fixable findings, and
  # uploads SARIF to the Security tab (decision memo 2026-06-10)
  dependency-scan:
    name: Scan dependencies with Grype
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required for upload-sarif
      actions: read # upload-sarif on private repos
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          manifest-path: pyproject.toml
          environments: default

      - name: Scan pixi environment with Grype
        uses: neutrons/conda-actions/grype@bba9ca89d48d9ae846db9650cc63fde736340b3d # v2
        with:
          path: ${{ github.workspace }}/.pixi/envs/default
          # real gate: only-fixed defaults to true in the v2 wrapper, so
          # unfixable advisories never fail the build
          fail-build: true

  conda-build:
    name: Build conda package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # for the grype SARIF upload
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          manifest-path: pyproject.toml
          environments: default

      - name: Build conda package
        run: |
          pixi run conda-build
          mkdir -p /tmp/local-channel/linux-64
          cp *.conda /tmp/local-channel/linux-64

      # pkg-verify requires a conda env that already has the package
      # installed (and micromamba on PATH); pkg-install sets both up.
      - name: Install built conda package
        id: install
        uses: neutrons/conda-actions/pkg-install@bba9ca89d48d9ae846db9650cc63fde736340b3d # v2
        with:
          package-name: ${{ env.PKG_NAME }}
          local-channel: /tmp/local-channel

      - name: Verify conda package
        uses: neutrons/conda-actions/pkg-verify@bba9ca89d48d9ae846db9650cc63fde736340b3d # v2
        with:
          package-name: ${{ env.PKG_NAME }}
          module-name: ${{ env.MODULE_NAME }}
          conda-env-name: ${{ steps.install.outputs.conda_env }}

      # audit the dependencies of the conda package we just installed
      - name: Scan installed environment with Grype
        uses: neutrons/conda-actions/grype@bba9ca89d48d9ae846db9650cc63fde736340b3d # v2
        with:
          path: ${{ steps.install.outputs.conda_install_dir }}

      - name: Upload conda package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-conda-package
          path: ${{ env.PKG_NAME }}-*.conda

  publish:
    name: Upload package to anaconda
    runs-on: ubuntu-latest
    needs: [tests, conda-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # same-run artifact downloads use the runner's runtime token, but this
      # job only executes on release tags — explicit read is cheap insurance
      # on a path that stays unexercised until then
      actions: read
    steps:
      - name: Download conda package artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-conda-package

      # README documents `conda install -c neutronimaging neutron-geomcorr`;
      # requires the ANACONDA_TOKEN repo secret (org decision: neutronimaging
      # channel, not neutrons)
      - name: Upload package to anaconda
        uses: neutrons/conda-actions/publish@bba9ca89d48d9ae846db9650cc63fde736340b3d # v2
        with:
          anaconda-token: ${{ secrets.ANACONDA_TOKEN }}
          organization: neutronimaging
          package-path: ${{ env.PKG_NAME }}-*.conda

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [tests, conda-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          manifest-path: pyproject.toml
          environments: default

      - name: Build pypi package
        run: pixi run pypi-build

      # needs the PyPI project + trusted publisher configured first
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
