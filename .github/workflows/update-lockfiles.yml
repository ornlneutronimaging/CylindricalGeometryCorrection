name: Update lockfiles

permissions:
  contents: write
  pull-requests: write

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"  # Run at 5:00 AM UTC every Monday

jobs:
  pixi-update:
    runs-on: ubuntu-latest
    steps:
      # Mint an App installation token so the PR is created by the App identity,
      # not GITHUB_TOKEN. PRs opened with GITHUB_TOKEN cannot trigger other
      # workflows (GitHub recursion guard), which left the lockfile PR's CI held
      # on "Approve and run"; an App token opens the PR as a first-class PR.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LOCKFILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LOCKFILE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          run-install: false

      - name: Update lockfiles
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown >> diff.md

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update pixi lockfile"
          title: "chore: Update pixi lockfile"
          body-path: diff.md
          branch: update-pixi
          base: next  # Default branch for this repository
          labels: dependencies,pixi
          delete-branch: true
          add-paths: pixi.lock

      - name: Run tests on updated dependencies
        if: steps.cpr.outputs.pull-request-number
        run: |
          echo "Pull request created: #${{ steps.cpr.outputs.pull-request-number }}"
          echo "Tests will run automatically via the pull_request trigger in test.yaml"

      - name: Add test status comment
        if: steps.cpr.outputs.pull-request-number
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ steps.cpr.outputs.pull-request-number }}
          body: |
            ## 🔄 Automated Dependency Update

            This PR was automatically created to update the pixi lockfile.

            ### ⚙️ Automatic Checks
            - Unit tests will run automatically on this PR
            - Pre-commit checks will run via pre-commit.ci
            - Please review the test results before merging

            ### 📋 Review Checklist
            - [ ] All tests pass
            - [ ] No breaking changes in dependencies
            - [ ] Review the dependency changes in the diff above
